name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline tests
        shell: pwsh
        run: .\build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexWeeklyTray-windows
          path: dist/CodexWeeklyTray.exe
